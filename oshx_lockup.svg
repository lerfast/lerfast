<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Oshlix logo">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2740" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
  </defs>

  <!-- Badge -->
  <g transform="translate(15,14)">
    <g transform="translate(46,46) rotate(-35) translate(-46,-46)">
      <rect x="2" y="2" width="88" height="88" rx="14" fill="none" stroke="#0F2740" stroke-width="6"/>
    </g>
    <g transform="translate(46,46) rotate(-25) translate(-46,-46)">
      <rect x="14" y="14" width="64" height="64" rx="12" fill="none" stroke="#00B4D8" stroke-width="6"/>
    </g>
  </g>

  <!-- Wordmark (uses Exo 2 on web) -->
  <g transform="translate(130,78)">
    <text font-family="'Exo 2', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-style="italic" font-weight="700" font-size="56"
          fill="url(#grad)">Oshlix</text>
  </g>
</svg>
